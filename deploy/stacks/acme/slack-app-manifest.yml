display_information:
  name: qm
  description: qm workspace agent for acme
  background_color: "#1f2937"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  agent_view:
    agent_description: "InterAgent helps you find relevant context, understand recent work, work with files, and complete operational tasks."
    suggested_prompts:
      - title: Catch me up
        message: Summarize the recent work and decisions that matter to me.
      - title: Find relevant context
        message: "Find the information most relevant to what I'm working on and summarize it."
      - title: Help with a task
        message: Help me plan and complete a task using the tools available to you.
  bot_user:
    display_name: qm
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - assistant:write
      - chat:write
      - chat:write.customize
      - im:history
      - im:read
      - im:write
      - users:read
      - users:read.email
      - channels:read
      - channels:history
      - groups:read
      - groups:history
      - mpim:read
      - mpim:write
      - mpim:history
      - files:read
      - files:write
      - reactions:write
      - reactions:read
      - emoji:read
settings:
  event_subscriptions:
    bot_events:
      - app_home_opened
      - app_mention
      - message.im
      - message.channels
      - message.groups
      - message.mpim
      - member_joined_channel
      - member_left_channel
      - reaction_added
      - reaction_removed
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
